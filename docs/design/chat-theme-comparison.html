<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开悟 · 四种深色风格对照</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c0d0f;color:#e6e7e9;font:13px/1.7 -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #b4bfdb;outline-offset:3px}[hidden]{display:none!important}svg{display:block;flex-shrink:0;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}main{max-width:1500px;margin:auto;padding:25px 24px 20px}.intro{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.intro h1{font-size:20px;letter-spacing:.01em;font-weight:500;margin:0 0 4px}.intro p{margin:0;color:#999da6;font-size:12px}.switcher{display:flex;gap:4px;background:#1b1d21;border-radius:10px;padding:4px;flex-shrink:0}.switcher button{min-height:30px;padding:3px 12px;border-radius:7px;color:#a7abb3;font-size:12px}.switcher button[aria-pressed=true]{background:#363940;color:#f0f0f2}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.tile{min-width:0;overflow:hidden;border:1px solid #34363c;border-radius:13px;background:var(--bg);color:var(--ink)}.tile-label{display:flex;align-items:center;gap:11px;padding:11px 16px;background:#1b1d21;color:#f0f0f2;border-bottom:1px solid #34363c}.letter{display:grid;place-items:center;flex-shrink:0;height:26px;width:26px;border:1px solid #50545c;border-radius:7px;font-size:12px;color:#b9bdc7}.tile-label h2{font-size:13px;font-weight:500;line-height:1.6;margin:0}.tile-label p{font-size:10px;line-height:1.6;color:#a2a6af;margin:0}.tile-label .enlarge{margin-left:auto;color:#a2a6af;min-height:29px;width:29px;border-radius:6px}.enlarge:hover{background:#2b2e34}.sample{display:flex;flex-direction:column;height:495px;min-height:0;background:var(--bg)}.chat-head{display:flex;align-items:center;gap:8px;flex-shrink:0;height:40px;padding:0 20px;background:var(--bar);border-bottom:1px solid var(--line);font-size:11px;color:var(--sub)}.chat-head strong{font-weight:500;color:var(--ink);margin-right:auto}.chat-head button{font-size:10px;color:var(--sub);min-height:24px;padding:1px 7px;border-radius:5px}.chat-head button[aria-pressed=true]{background:var(--chip);color:var(--ink)}.messages{flex:1;min-height:0;overflow:auto;padding:18px 22px 8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.user{display:flex;justify-content:flex-end;margin:0 0 16px}.user p{max-width:83%;padding:8px 13px;background:var(--user);border-radius:var(--bubble-radius);margin:0;font-size:14px;line-height:1.85;letter-spacing:.01em;overflow-wrap:anywhere}.assistant{font-size:14px;line-height:1.9;letter-spacing:.01em;margin:0 0 16px;max-width:640px;overflow-wrap:anywhere}.assistant p{margin:0}.assistant p+p{margin-top:10px}.assistant code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:.92em;line-height:1.45;letter-spacing:0;display:inline-block;max-width:100%;overflow-wrap:anywhere;padding:1px 4px;background:var(--chip);border-radius:4px}.assistant.latest{margin-bottom:0}.evidence{font-size:10px;color:var(--warn);letter-spacing:0;line-height:1.8;margin:9px 0 7px}.actions{display:flex;align-items:center;gap:8px;min-height:31px;border-top:1px solid var(--line);padding-top:3px}.actions button{color:var(--sub);font-size:11px;min-height:27px;padding:0}.actions svg{width:13px;height:13px}.actions button[aria-expanded=true] svg{transform:rotate(180deg)}.actions .result-toggle{margin-left:auto}.actions .info{width:24px;margin-left:4px}.details{background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:11px;line-height:1.8;letter-spacing:0;padding:10px 12px;color:var(--sub);margin-top:8px}.composer{padding:9px 15px 12px;flex-shrink:0;background:var(--bg)}.editor{border:1px solid var(--line);border-radius:var(--editor-radius);background:var(--panel);padding:10px 11px}.editor:focus-within{border-color:var(--accent)}textarea{display:block;resize:none;border:0;background:transparent;outline:0;width:100%;height:48px;min-height:48px;padding:0;font-size:12px;line-height:1.8;letter-spacing:.01em}textarea::placeholder{color:var(--muted)}.editor-tools{display:flex;align-items:center;gap:6px;margin-top:4px}.editor-tools button{width:24px;height:26px;padding:0;color:var(--sub);border-radius:5px}.editor-tools svg{width:14px;height:14px}.model{margin-left:auto;font-size:9px;color:var(--muted);padding-right:4px;white-space:nowrap}.editor-tools button.send{width:30px;height:30px;border-radius:var(--send-radius);background:var(--send);color:var(--send-ink)}.send svg{width:15px;height:15px}.demo-notice{font-size:10px;line-height:1.6;color:var(--sub);margin-top:6px}.gallery[data-focus]:not([data-focus=all]){grid-template-columns:minmax(0,1fr);max-width:840px;margin:auto}.gallery[data-focus]:not([data-focus=all]) .sample{height:650px}.gallery[data-focus]:not([data-focus=all]) .messages{padding:24px 28px 12px}.footnote{font-size:11px;color:#8f949d;margin:16px 0 0;text-align:center}.footnote a{color:#aeb8ca;text-decoration:none}.footnote a:hover{text-decoration:underline}
[data-style=chatgpt]{--bg:#212121;--bar:#212121;--panel:#303030;--user:#303030;--ink:#ececec;--sub:#b4b4b4;--muted:#9b9b9b;--line:#424242;--chip:#363636;--accent:#d8d8d8;--send:#ececec;--send-ink:#212121;--warn:#c3ae7d;--bubble-radius:18px;--editor-radius:20px;--send-radius:50%}
[data-style=claude]{--bg:#262624;--bar:#262624;--panel:#30302e;--user:#383832;--ink:#e8e6dc;--sub:#b8b5a9;--muted:#9f9c90;--line:#45453e;--chip:#3b3b35;--accent:#d49b83;--send:#c58e76;--send-ink:#211e1b;--warn:#c4b28d;--bubble-radius:10px;--editor-radius:13px;--send-radius:7px}
[data-style=paseo]{--bg:#111317;--bar:#181b20;--panel:#1c2027;--user:#292f39;--ink:#e0e4eb;--sub:#a9b1bf;--muted:#8f99aa;--line:#343c49;--chip:#2b323d;--accent:#a8b7d5;--send:#a6b5d3;--send-ink:#19212f;--warn:#c4b18a;--bubble-radius:9px;--editor-radius:11px;--send-radius:7px}
[data-style=gemini]{--bg:#171b22;--bar:#171b22;--panel:#252c38;--user:#2b3443;--ink:#e3e6ed;--sub:#b3bed1;--muted:#98a7bd;--line:#3b485c;--chip:#303b4d;--accent:#a8c7fa;--send:#a8c7fa;--send-ink:#152d4e;--warn:#c7b58e;--bubble-radius:20px;--editor-radius:24px;--send-radius:50%}
@media(min-width:1600px){main{padding-top:30px}.sample{height:535px}.messages{padding-top:22px}.user,.assistant{margin-bottom:19px}}
@media(max-width:900px){main{padding:18px 16px}.intro{display:block;margin-bottom:16px}.switcher{margin-top:14px;width:max-content;max-width:100%;flex-wrap:wrap}.gallery{grid-template-columns:minmax(0,1fr);max-width:720px;margin:auto}.sample{height:595px}.intro h1{font-size:19px}.footnote{line-height:1.9}}
@media(max-width:440px){main{padding:16px 12px}.intro p{font-size:11px}.switcher{gap:1px;padding:3px}.switcher button{font-size:11px;padding:3px 9px}.tile-label{padding:10px 12px}.tile-label p{font-size:9px}.chat-head{padding:0 15px}.messages,.gallery[data-focus]:not([data-focus=all]) .messages{padding:18px 16px 8px}.sample,.gallery[data-focus]:not([data-focus=all]) .sample{height:630px}.user p{max-width:87%;padding:8px 11px}.composer{padding:9px 10px 11px}.model{font-size:8px}.assistant{font-size:14px}.tile-label h2{font-size:12px}.intro h1{font-size:18px}}
</style></head><body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs><symbol id="arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol><symbol id="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="image" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m5 17 5-6 4 4 3-3 3 4"/><circle cx="15" cy="8" r="1"/></symbol><symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/></symbol><symbol id="expand" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6m0 6 7-7"/></symbol></defs></svg>
<main><header class="intro"><div><h1>四种深色，放在一起看</h1><p>同样的聊天内容与排版，比较配色、明暗和控件质感。风格参考，非官方原版截图。</p></div><nav class="switcher" aria-label="风格对照"><button data-focus="all" aria-pressed="true">四款对照</button><button data-focus="chatgpt" aria-pressed="false">A</button><button data-focus="claude" aria-pressed="false">B</button><button data-focus="paseo" aria-pressed="false">C</button><button data-focus="gemini" aria-pressed="false">D</button></nav></header>
<div class="gallery" id="gallery" data-focus="all"></div>
<p class="footnote">Claude Code 为终端工具，B 参考 Claude 图形界面的暖灰方向。 · 仅设计稿，不发送消息或修改任务。</p>
</main>
<template id="chat-template"><div class="sample"><header class="chat-head"><strong>任务 · Go Web 服务</strong><button class="filter-all" aria-pressed="true">全部</button><button class="filter-user" aria-pressed="false">我的问题</button></header><div class="messages"><article class="user" aria-label="我的消息"><p>先实现 /hello 接口，返回 world。</p></article><article class="assistant" aria-label="助手回复"><p>已实现 <code>/hello</code> 接口，返回 <code>world</code>。基础服务与启动说明也已准备好。</p></article><article class="user" aria-label="我的消息"><p>为 /hello 服务加入逐请求访问日志，并补充相关验证。</p></article><article class="assistant latest" aria-label="助手本轮回复"><p>已为 <code>/hello</code> 接口加入逐请求访问日志。</p><p>新增状态码、响应大小和客户端地址记录；支持 <code>--log-file</code>，将日志同时写入终端与文件。</p><div class="evidence">8 项检查 · 0 项有依据　待核实</div><div class="actions"><button class="detail-toggle" aria-expanded="false"><span>执行详情</span><svg aria-hidden="true"><use href="#chevron"/></svg></button><button class="result-toggle" aria-expanded="false">查看结果</button><button class="info" aria-label="本轮信息" aria-expanded="false"><svg aria-hidden="true"><use href="#more"/></svg></button></div><div class="details" hidden>配色比较稿：仅模拟展开，没有真实执行记录。</div></article></div><div class="composer"><div class="editor"><textarea rows="2" aria-label="消息草稿" placeholder="补充这个任务的要求……"></textarea><div class="editor-tools"><button aria-label="添加附件"><svg aria-hidden="true"><use href="#plus"/></svg></button><button aria-label="截图"><svg aria-hidden="true"><use href="#image"/></svg></button><button aria-label="预览"><svg aria-hidden="true"><use href="#eye"/></svg></button><span class="model">MiniMax-M3.1-Flash</span><button class="send" aria-label="发送（仅模拟）"><svg aria-hidden="true"><use href="#arrow"/></svg></button></div><div class="demo-notice" role="status" hidden>这里只比较外观，不会发送或上传。</div></div></div></div></template>
<script>
const styles=[{id:'chatgpt',letter:'A',name:'ChatGPT · 石墨灰',note:'中性灰阶，低装饰，黑白控件'},{id:'claude',letter:'B',name:'Claude · 暖灰米白',note:'暖色底、柔和文字、少量陶土色'},{id:'paseo',letter:'C',name:'Paseo 方向 · 冷灰工作台',note:'较深底色、清楚分区、克制的蓝灰'},{id:'gemini',letter:'D',name:'Google Gemini 方向 · 蓝灰',note:'抬亮输入区、蓝色强调、圆润控件'}];
const gallery=document.querySelector('#gallery');const template=document.querySelector('#chat-template');
for(const t of styles){const tile=document.createElement('section');tile.className='tile';tile.dataset.style=t.id;tile.setAttribute('aria-label',t.name);const label=document.createElement('header');label.className='tile-label';label.innerHTML='<span class="letter">'+t.letter+'</span><div><h2>'+t.name+'</h2><p>'+t.note+'</p></div><button class="enlarge" aria-label="单独看 '+t.letter+'"><svg aria-hidden="true"><use href="#expand"/></svg></button>';tile.append(label,template.content.cloneNode(true));gallery.append(tile);label.querySelector('button').onclick=()=>focus(t.id);
const all=tile.querySelector('.filter-all'),user=tile.querySelector('.filter-user');function filter(only){all.setAttribute('aria-pressed',String(!only));user.setAttribute('aria-pressed',String(only));tile.querySelectorAll('.assistant').forEach(el=>el.hidden=only)}all.onclick=()=>filter(false);user.onclick=()=>filter(true);
for(const button of tile.querySelectorAll('.actions button'))button.onclick=()=>{const details=tile.querySelector('.details'),open=button.getAttribute('aria-expanded')!=='true';tile.querySelectorAll('.actions button').forEach(b=>b.setAttribute('aria-expanded','false'));button.setAttribute('aria-expanded',String(open));details.hidden=!open;details.textContent=button.classList.contains('info')?'模拟会话 · pi · MiniMax-M3.1-Flash；不连接真实执行端。':'配色比较稿：仅模拟展开，没有真实执行记录。'};
for(const b of tile.querySelectorAll('.editor-tools button'))b.onclick=()=>{tile.querySelector('.demo-notice').hidden=false};}
function focus(id){if(!['all',...styles.map(s=>s.id)].includes(id))id='all';gallery.dataset.focus=id;document.querySelectorAll('.tile').forEach(el=>el.hidden=id!=='all'&&el.dataset.style!==id);document.querySelectorAll('.switcher button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.focus===id)));const url=new URL(location.href);url.searchParams.set('focus',id);history.replaceState(null,'',url);window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('.switcher button').forEach(b=>b.onclick=()=>focus(b.dataset.focus));focus(new URLSearchParams(location.search).get('focus')||'all');
</script></body></html>
