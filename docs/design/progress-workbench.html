  <script>
    const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),icon=id=>`<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
    const topics=[{id:'foundation',name:'项目基础',color:'#95ada1'},{id:'tasks',name:'任务协作',color:'#aaa1bb'},{id:'chat',name:'聊天体验',color:'#a9b58c'},{id:'other',name:'其他',color:'#bdbaa7'}];
    const tasks=[
      {id:'login',number:'KW-12',topic:'foundation',title:'登录状态持久化',desc:'记住登录，刷新后恢复原来的工作台',status:'running',git:'dirty',time:'刚刚更新'},
      {id:'init',number:'KW-09',topic:'foundation',title:'自动初始化项目目录',desc:'填入服务器路径，即可开始一个新项目',status:'review',git:'unmerged',time:'8 分钟前'},
      {id:'model',number:'KW-11',topic:'foundation',title:'选择 pi 对话模型',desc:'读取可用模型，保存项目默认配置',status:'done',git:'merged',time:'24 分钟前'},
      {id:'worktree',number:'KW-07',topic:'tasks',title:'每个任务独立开发',desc:'隔离工作区和会话，保留原有上下文',status:'done',git:'merged',time:'1 小时前'},
      {id:'merge',number:'KW-14',topic:'tasks',title:'审核并合并任务成果',desc:'检查实际 Git 状态，确认后合并',status:'review',git:'unmerged',time:'12 分钟前'},
      {id:'markdown',number:'KW-08',topic:'chat',title:'Markdown 与代码高亮',desc:'支持表格、代码块和一键复制',status:'done',git:'merged',time:'42 分钟前'},
      {id:'progress',number:'KW-15',topic:'chat',title:'让开发进展一目了然',desc:'方案、成果和验证按结构展示',status:'idle',git:'not_started',time:'待开始'},
      {id:'mobile',number:'KW-13',topic:'other',title:'收紧窄屏下的布局',desc:'保持看板与对话的阅读和操作空间',status:'failed',git:'dirty',time:'需要处理'},
      {id:'release',number:'KW-16',topic:'other',title:'整理首版使用说明',desc:'项目创建、开始开发与结果确认',status:'idle',git:'not_started',time:'待开始'}
    ];
    const labels={idle:'未开始',running:'执行中',review:'需要确认',done:'执行完成',failed:'执行失败'},gitLabels={not_started:'尚未开发',dirty:'待提交',unmerged:'未合并',merged:'已合并'};
    let selected='login',tab='results',scene='running',onlyAttention=false,online=true,compact=false,toastTimer,dialogReturn;
    const drafts={},extraMessages={};
    const special={
      login:{goal:'让登录状态在刷新和重启后保持一致。',steps:['保存有期限的登录凭证','刷新时恢复原登录状态','验证退出、过期和服务重启'],features:[['30 天记住登录','重新打开浏览器仍可进入工作台','已验证'],['刷新自动恢复','保留项目和当前任务的访问入口','已验证'],['退出后撤销凭证','主动退出后，旧登录立即失效','验证中']],question:'刷新以后不要再让我输入密钥。',reply:'记住登录和刷新恢复已完成。正在验证退出后的凭证撤销，结果会更新在上方。'},
      init:{goal:'只填项目路径，就能登记或初始化仓库。',steps:['校验服务器绝对路径','创建目录并初始化 Git','验证已有文件和远程配置保留'],features:[['自动创建目录','路径不存在时创建服务器目录','已验证'],['自动初始化 Git','已有仓库直接登记，不覆盖原文件','已验证'],['可选远程地址','留空即可使用，填写时配置 origin','已验证']],question:'给你一个目录，帮我初始化 Git 就好了。',reply:'项目目录与 Git 初始化流程已完成，三项验证通过。可以确认结果，也可以继续补充要求。'}
    };
    function current(){return tasks.find(t=>t.id===selected)}
    function detail(t){return special[t.id]||{goal:t.desc+'。',steps:['确认需求与边界','完成实现并保留任务工作区','执行验证并整理结果'],features:[[t.title,'实现当前任务约定的功能',t.status==='done'?'已验证':'AI 报告'],['验证与异常处理','核对正常流程及失败后的处理',t.status==='done'?'已验证':t.status==='failed'?'待核实':'未验证']],question:'请推进「'+t.title+'」这个任务。',reply:t.status==='idle'?'方案已整理。点击播放图标或发送“开始开发”，即可启动这个任务。':t.status==='failed'?'窄屏下的布局检查未通过，已保留现有改动。请查看阻塞原因，再决定如何继续。':'本轮改动已整理到成果卡，验证依据可以在“验证”中查看。'}}
    function statusClass(status){return status==='idle'?'':status}
    function saveDraft(){drafts[selected||'project']=$('draft').value}
    function switchTask(id){saveDraft();selected=id;tab='results';compact=false;if(id==='login')scene=current().status==='review'?'review':current().status==='failed'?'failed':'running';else scene=id?'task':'project';render();if(innerWidth<=760)setMobile('chat')}
    function sceneChange(value){saveDraft();scene=value;selected=value==='project'?null:'login';if(selected)current().status=value;tab='results';compact=false;render();if(innerWidth<=760)setMobile('chat')}
    function renderBoard(){
      $('board-count').textContent=`${topics.length} 个专题 · ${tasks.length} 个任务`;
      $('columns').innerHTML=topics.map(topic=>{
        const all=tasks.filter(t=>t.topic===topic.id),visible=all.filter(t=>!onlyAttention||['review','failed'].includes(t.status));
        return `<section class="column" aria-label="${esc(topic.name)}"><div class="column-head"><div class="column-label"><span class="topic-dot" style="--topic:${topic.color}"></span>${esc(topic.name)}<span class="count">${all.length}</span></div><div class="row"><button class="icon" aria-label="在${esc(topic.name)}添加任务" data-action="new-task" data-topic="${topic.id}">${icon('plus')}</button></div></div>${visible.map(t=>`<article class="task-card ${selected===t.id?'selected':''}" data-card="${t.id}"><button class="task-select" aria-pressed="${selected===t.id}" data-select="${t.id}" aria-label="选择任务：${esc(t.title)}"><div class="task-top"><span class="task-number">${t.number}</span><span class="pill ${statusClass(t.status)}">${t.status!=='idle'?'<span class="dot"></span>':''}${labels[t.status]}</span></div><h3>${esc(t.title)}</h3><p class="task-desc">${esc(t.desc)}</p></button><div class="card-owner"><span class="row"><span class="mini-pi">π</span><span>pi</span></span><span>${t.time}</span></div><div class="card-bottom"><span class="row git-label ${t.git==='merged'?'merged':t.git==='dirty'?'dirty':''}">${icon('branch')}${gitLabels[t.git]}</span><span class="row">${t.status==='idle'?`<button class="icon" data-card-start="${t.id}" aria-label="开始开发：${esc(t.title)}" title="开始开发">${icon('play')}</button>`:`<button class="icon" data-card-merge="${t.id}" aria-label="合并任务：${esc(t.title)}" title="合并到主分支" ${t.git==='merged'?'disabled':''}>${icon('merge')}</button>`}</span></div></article>`).join('')}${!visible.length?'<div class="empty-filter">这里没有待处理任务</div>':''}<button class="add-card" data-action="new-task" data-topic="${topic.id}">＋ 添加任务</button></section>`
      }).join('');
    }
    function featureRows(t){
      const d=detail(t);let features=d.features.map(f=>[...f]);
      if(t.id==='login'&&t.status==='review')features[2][2]='已验证';
      if(t.id==='login'&&t.status==='failed')features[2]=['服务重启后恢复','恢复检查失败，已有修改保留','待核实'];
      if(t.id==='login'&&t.status==='done')features.forEach(f=>f[2]='已验证');
      return features.map(f=>`<div class="feature-row"><span class="feature-icon ${f[2]==='验证中'||f[2]==='待核实'?'active':''}">${f[2]==='已验证'?'✓':'·'}</span><div class="feature-copy"><b>${esc(f[0])}</b><p>${esc(f[1])}</p></div><span class="proof ${f[2]==='已验证'?'':f[2]==='验证中'?'pending':'reported'}">${esc(f[2])}</span></div>`).join('');
    }
    function projectTop(){const n=s=>tasks.filter(t=>t.status===s).length;return `<div class="row between"><span class="progress-caption">项目概览</span><small>刚刚更新</small></div><h2>一眼看到，接下来该做什么</h2><div class="project-metrics"><div><div class="metric-value">${n('running')}</div><div class="metric-label">正在推进</div></div><div><div class="metric-value">${n('review')}</div><div class="metric-label">等待你确认</div></div><div><div class="metric-value" style="color:#ba8e79">${n('failed')}</div><div class="metric-label">需要处理</div></div></div>`}
    function renderReport(){
      const t=current();$('progress-card').classList.toggle('compact-view',compact);
      if(!t){$('progress-top').innerHTML=projectTop();$('result-count').textContent=tasks.filter(t=>t.status==='done').length;$('report-foot').innerHTML='<span>汇总来自各任务的独立进展</span><span>按任务查看验证依据</span>';}
      else{
        const s=t.status,headline=s==='running'?'功能已实现，正在完成最后一项验证':s==='review'?'本轮开发结束，结果等待你确认':s==='failed'?'验证遇到阻塞，已有改动已保留':s==='done'?'开发与结果确认已完成':'方案已整理，等待开始开发';
        const note=s==='running'?'当前：检查退出后的登录凭证是否立即撤销。':s==='review'?'本轮成果和验证依据已整理，可继续修改。':s==='failed'?'服务重启后，登录恢复检查没有通过。':s==='done'?'合并状态按实际 Git 记录独立显示。':'开始后将在这个位置持续更新进展。';
        $('progress-top').innerHTML=`<div class="row between"><span class="progress-caption">${s==='review'||s==='done'?'本轮结果':'本轮进展'} <span style="color:#bdc7b8;margin-left:6px">01</span></span><span class="pill ${statusClass(s)}"><span class="dot"></span>${s==='running'?'验证中':labels[s]}</span></div><h2>${t.id==='login'?headline:s==='running'?'正在推进当前任务':headline}</h2><p>${t.id==='login'?note:detail(t).goal}</p><div class="stage-track"><span class="stage ${s!=='idle'?'finished':'current'}"><span class="stage-icon">${s!=='idle'?'✓':'1'}</span>梳理方案</span><span class="stage-link"></span><span class="stage ${['running','review','done','failed'].includes(s)?'finished':''}"><span class="stage-icon">${s!=='idle'?'✓':'2'}</span>开发实现</span><span class="stage-link"></span><span class="stage ${['review','done'].includes(s)?'finished':s!=='idle'?'current':''}"><span class="stage-icon">${['review','done'].includes(s)?'✓':'3'}</span>验证结果</span></div>`;
        $('result-count').textContent=detail(t).features.length;
        $('report-foot').innerHTML=`<span class="row git-label ${t.git==='merged'?'merged':'dirty'}">${icon('branch')}${gitLabels[t.git]}<span style="color:#bdc5b6;margin:0 2px">·</span>main</span><button data-action="${t.git==='merged'?'merged-info':'merge'}" ${t.status==='running'||t.status==='idle'?'disabled':''}>${t.git==='merged'?'查看合并结果':'合并预检'}${icon('chevron')}</button>`;
      }
      document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.tabIndex=b.dataset.tab===tab?0:-1});
      $('report-body').setAttribute('aria-labelledby','tab-'+tab);
      if(!t){
        $('report-body').innerHTML=tab==='results'?`<div class="project-list">已确认完成 <b>${tasks.filter(t=>t.status==='done').length}</b> 项，<b>${tasks.filter(t=>t.status==='review').length}</b> 项等待你确认。<br><button data-select="login">${icon('chevron')} 登录状态持久化 · ${labels[tasks.find(t=>t.id==='login').status]}</button><br><button data-select="mobile">${icon('chevron')} 窄屏布局 · 需要处理</button></div>`:tab==='plan'?'<p class="plan-intro">先完善个人开发的完整任务流程。</p><div class="plan-row"><span class="plan-no">1</span>项目创建与会话恢复</div><div class="plan-row"><span class="plan-no">2</span>卡片独立开发与成果合并</div><div class="plan-row"><span class="plan-no">3</span>结构化进展与简洁对话</div>':tab==='checks'?'<div class="project-list">验证结果按任务单独保存。<br>执行结束、验证通过、用户确认和 Git 合并分别显示，点击卡片查看依据。</div>':'<div class="project-list">此处只显示项目级事件。<br>任务的命令和过程记录保留在对应卡片中。</div>';return;
      }
      if(tab==='results')$('report-body').innerHTML=featureRows(t);
      if(tab==='plan')$('report-body').innerHTML=`<p class="plan-intro">${esc(detail(t).goal)}</p>${detail(t).steps.map((s,i)=>`<div class="plan-row"><span class="plan-no">${i+1}</span><span>${esc(s)}</span></div>`).join('')}<details class="inline-details"><summary>查看方案说明</summary><p>沿用当前任务的独立会话与工作区。先完成约定功能，再用执行记录核对验证结果；需要你决定的事项直接出现在对话中。提交和合并需单独确认。</p></details>`;
      if(tab==='checks'){
        const checks=t.id==='login'?[['刷新后自动恢复','通过'],['重新打开浏览器','通过'],[t.status==='failed'?'服务重启后恢复':'退出后撤销凭证',t.status==='review'||t.status==='done'?'通过':t.status==='failed'?'失败':t.status==='idle'?'未执行':'验证中']]:[['主要功能流程',t.status==='done'||t.status==='review'?'通过':'待核实'],['异常与恢复流程',t.status==='done'?'通过':t.status==='failed'?'失败':'未执行']];
        $('report-body').innerHTML=checks.map(c=>`<div class="validation-row"><span>${esc(c[0])}</span><span class="row"><span class="proof ${c[1]==='通过'?'':c[1]==='验证中'?'pending':'reported'}">${c[1]}</span><button data-evidence="${esc(c[0])}" data-evidence-status="${c[1]}" aria-label="查看验证依据：${esc(c[0])}">依据 ${icon('chevron')}</button></span></div>`).join('')+'<p class="evidence-note">验证状态对应执行记录；仅 AI 报告的成果标为待核实。</p>';
      }
      if(tab==='records')$('report-body').innerHTML=[['10:42','执行登录恢复回归测试','go test ./internal/webapi -run TestRememberedLogin\nPASS（示例执行记录）'],['10:38','完成登录凭证撤销处理','已更新登录撤销行为，等待对应回归确认。'],['10:32','核对现有会话与恢复流程','读取现有流程；任务工作区保持独立。']].map(x=>`<details class="log-entry"><summary><time>${x[0]}</time><span>${x[1]}</span>${icon('down')}</summary><pre>${esc(x[2])}</pre></details>`).join('');
    }
    function renderConversation(){
      const t=current();$('conversation-title').textContent=t?t.title:'开悟工作台';$('scope-label').textContent=t?'任务对话':'项目对话';$('conversation-sub').textContent=t?'任务 Agent · 独立会话':'项目 Agent · 项目沟通';$('composer-target').textContent=t?'发送至任务 · '+t.title:'发送至项目 · 开悟工作台';$('draft').value=drafts[selected||'project']||'';
      $('start-task').hidden=!t||t.status!=='idle';$('merge-task').hidden=!t;$('merge-task').disabled=!t||['running','idle'].includes(t.status)||t.git==='merged';
      renderReport();
      $('attention').innerHTML=t&&t.status==='review'?'<div class="attention"><strong style="font-weight:500">需要你确认本轮结果</strong><p>确认结果不会自动提交或合并代码。</p><div class="attention-actions"><button class="primary small" data-action="accept">确认结果</button><button class="line-button" data-action="revise">继续修改</button></div></div>':t&&t.status==='failed'?'<div class="attention failed"><strong style="font-weight:500">阻塞：恢复检查失败</strong><p>已保留任务改动，需要处理失败项后再验证。</p><div class="attention-actions"><button class="line-button" data-action="show-checks">查看失败依据</button><button class="line-button" data-action="revise">补充处理要求</button></div></div>':'';
      const question=t?detail(t).question:'帮我总结一下项目目前的进展。';let reply=t?detail(t).reply:`当前有 ${tasks.filter(t=>t.status==='running').length} 项正在推进，${tasks.filter(t=>t.status==='review').length} 项待确认。${tasks.filter(t=>t.status==='failed').length} 项需要处理，详情已整理在项目概览。`;
      if(t?.id==='login'&&t.status==='review')reply='本轮三项功能验证已通过，结果已更新在上方。请确认是否符合预期，或告诉我需要继续修改的地方。';
      if(t?.id==='login'&&t.status==='failed')reply='登录恢复检查没有通过，现有改动已保留。失败依据放在“验证”里，需要先处理再继续。';
      if(t?.id==='login'&&t.status==='done')reply='本轮结果已确认。代码尚未合并，可在合并预检中核对后再执行。';
      $('chat').innerHTML=`<div class="day-divider">今天 · ${t?'任务沟通':'项目沟通'}</div><div class="chat-user"><div class="bubble">${esc(question)}</div><span class="chat-time">10:31</span></div>${t&&t.status!=='idle'?'<details class="process-notes"><summary>过程更新 · 6 条，按需展开</summary><ol><li>检查现有实现和任务要求</li><li>核对受影响的流程</li><li>调整登录状态保存</li><li>完善恢复与撤销逻辑</li><li>执行回归检查</li><li>整理本轮成果与验证依据</li></ol></details>':''}<div class="chat-agent"><span class="pi-avatar">π</span><div class="agent-body"><div class="agent-byline">pi <small>${t?'任务 Agent':'项目 Agent'}</small><small style="margin-left:auto">10:42</small></div><p>${esc(reply)}</p><button class="summary-link" data-action="show-results">查看${t?'本轮成果':'项目概览'} ${icon('chevron')}</button></div></div>${(extraMessages[selected||'project']||[]).map(m=>m.role==='user'?`<div class="chat-user" style="margin-top:18px"><div class="bubble">${esc(m.text)}</div><span class="chat-time">刚刚</span></div>`:`<div class="chat-agent"><span class="pi-avatar">π</span><div class="agent-body"><div class="agent-byline">pi <small>演示回复</small></div><p>${esc(m.text)}</p></div></div>`).join('')}`;
      $('send').disabled=!online||!$('draft').value.trim();
    }
    function render(){renderBoard();renderConversation();document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelector('.mobile-scenes').value=['running','review','failed','project'].includes(scene)?scene:'running'}
    function chooseTab(value,focus=false){tab=value;compact=false;renderReport();if(focus)$('tab-'+value).focus()}
    function setMobile(value){document.body.classList.toggle('show-board',value==='board');document.querySelectorAll('[data-mobile]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mobile===value)))}
    function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
    function openDialog(html){dialogReturn=document.activeElement;$('dialog-body').innerHTML=html;$('dialog').showModal()}
    function closeDialog(){$('dialog').close();if(dialogReturn?.isConnected)dialogReturn.focus()}
    function openNewTask(topic){openDialog(`<h2>新建任务卡片</h2><p>交互示例：卡片和对话只保存在本设计稿内。</p><form id="new-task-form"><label>任务名称<input name="title" required maxlength="60" autofocus placeholder="例如：完善项目概览"></label><label>功能专题<select name="topic">${topics.map(t=>`<option value="${t.id}" ${t.id===topic?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><div class="actions"><button type="button" class="line-button" data-action="close-dialog">取消</button><button class="primary">创建卡片</button></div></form>`)}
    function openMerge(){const t=current();if(!t){notify('请先选择需要合并的任务卡片');return}if(['running','idle'].includes(t.status)){notify('当前任务尚未具备合并条件，请先完成开发与检查');return}if(t.git==='merged'){notify('当前任务成果已合并（示例状态）');return}openDialog(`<h2>合并任务成果</h2><p>示例审核：${esc(t.title)} → main</p><ul><li>核对任务与目标主分支</li><li>${t.git==='dirty'?'有待提交修改，需先创建任务提交':'任务已有提交，可审核合并'}</li><li>保留任务分支、工作区与原会话</li></ul><p>这是交互演示，确认仅改变示例卡片状态。</p><div class="actions"><button class="line-button" data-action="close-dialog">取消</button><button class="primary" data-action="confirm-merge">${t.git==='dirty'?'演示提交并合并':'演示合并'}</button></div>`)}
    function send(){if(!online||!$('draft').value.trim())return;const text=$('draft').value.trim();if(['开始开发','开始开发。'].includes(text)){start();return}if(/^(请)?(提交并)?合并到主分支[。！!.]*$/.test(text)){openMerge();return}const key=selected||'project';extraMessages[key]||=[];extraMessages[key].push({role:'user',text},{role:'assistant',text:'已记录这条补充要求。正式版本会由当前独立 pi 会话处理，并将进展更新在上方。'});drafts[key]='';renderConversation();$('right-scroll').scrollTop=$('right-scroll').scrollHeight}
    function start(){if(!current()){notify('请先选择任务卡片');return}if(current().status!=='idle'){notify('任务已开始，可在当前对话继续沟通');return}saveDraft();current().status='running';current().git='dirty';current().time='刚刚更新';render();notify('已演示开始开发；未启动真实 Agent')}
    document.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.scene){sceneChange(b.dataset.scene);return}if(b.dataset.select){switchTask(b.dataset.select);return}if(b.dataset.tab){chooseTab(b.dataset.tab);return}if(b.dataset.mobile){setMobile(b.dataset.mobile);return}
      if(b.dataset.cardStart){switchTask(b.dataset.cardStart);start();return}if(b.dataset.cardMerge){switchTask(b.dataset.cardMerge);openMerge();return}
      if(b.dataset.evidence){openDialog(`<h2>验证依据</h2><p>${esc(b.dataset.evidence)}</p><ul><li>来源：本轮命令执行记录</li><li>对象：${esc(current().title)}</li><li>当前状态：${esc(b.dataset.evidenceStatus)}</li></ul><p>这里使用固定示例；正式版本应关联实际命令、结果和时间，不凭 AI 文字认定通过。</p><div class="actions"><button class="line-button" data-action="close-dialog">关闭</button></div>`);return}
      const a=b.dataset.action;
      if(a==='project')switchTask(null);
      if(a==='filter'){onlyAttention=!onlyAttention;b.setAttribute('aria-pressed',String(onlyAttention));$('filter-label').textContent=onlyAttention?'待我处理':'全部任务';renderBoard()}
      if(a==='new-task')openNewTask(b.dataset.topic||'other');
      if(a==='new-topic')openDialog('<h2>添加功能专题</h2><p>专题用于组织相关任务，执行状态独立显示。</p><form id="new-topic-form"><label>专题名称<input name="name" required maxlength="25" autofocus></label><div class="actions"><button type="button" class="line-button" data-action="close-dialog">取消</button><button class="primary">添加专题</button></div></form>');
      if(a==='compact'){compact=!compact;renderReport()}
      if(a==='connection'){online=!online;$('connection-label').textContent=online?'已连接':'离线 · 点击恢复';document.querySelector('.connection .dot').style.color=online?'#81a490':'#ba9b82';$('send').disabled=!online||!$('draft').value.trim();notify(online?'连接状态已恢复（演示），原草稿保留':'离线状态演示：草稿保留，暂停发送')}
      if(a==='merge')openMerge();if(a==='start')start();if(a==='close-dialog')closeDialog();
      if(a==='confirm-merge'){current().git='merged';closeDialog();saveDraft();render();notify('已演示合并成功；没有执行 Git 命令')}
      if(a==='merged-info')notify('示例状态：任务成果已进入 main；不代表已经推送');
      if(a==='accept'){saveDraft();current().status='done';current().time='刚刚确认';render();notify('本轮结果已确认（演示）；合并仍需单独审核')}
      if(a==='revise'){$('draft').focus();notify('在当前任务对话补充需要修改的内容')}
      if(a==='show-results'||a==='show-checks'){chooseTab(a==='show-checks'?'checks':'results');$('right-scroll').scrollTop=0}
    });
    document.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.target);if(event.target.id==='new-task-form'){const id='new-'+Date.now();tasks.push({id,number:'KW-'+(17+tasks.length-9),topic:data.get('topic'),title:data.get('title').trim(),desc:'新任务，等待进一步沟通和开始开发',status:'idle',git:'not_started',time:'刚刚创建'});closeDialog();switchTask(id);notify('已添加示例卡片')}if(event.target.id==='new-topic-form'){const name=data.get('name').trim();if(!name)return;topics.push({id:'topic-'+Date.now(),name,color:'#9caf9c'});closeDialog();renderBoard();notify('已添加示例专题')}});
    document.querySelector('.mobile-scenes').addEventListener('change',event=>sceneChange(event.target.value));
    document.querySelector('.report-tabs').addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;const tabs=['plan','results','checks','records'];event.preventDefault();const index=tabs.indexOf(tab);chooseTab(event.key==='Home'?'plan':event.key==='End'?'records':tabs[(index+(event.key==='ArrowRight'?1:3))%4],true)});
    $('draft').addEventListener('input',()=>{drafts[selected||'project']=$('draft').value;$('send').disabled=!online||!$('draft').value.trim()});$('draft').addEventListener('keydown',event=>{if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)&&!event.isComposing){event.preventDefault();send()}});$('send').addEventListener('click',send);
    $('dialog').addEventListener('click',event=>{if(event.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog()}});
    render();
  </script>
</body>
</html>
