<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建任务 · 设计稿</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#23282e;color:#e0e4e9;font:14px/1.5 system-ui,"Noto Sans CJK SC",sans-serif;min-height:100vh;display:grid;place-items:center;padding:32px 20px}.wrap{width:min(100%,560px)}.caption{color:#96a2af;font-size:12px;margin:0 0 12px 4px;letter-spacing:1px}.dialog{background:#2c3138;border:1px solid #4b5663;border-radius:16px;padding:28px;box-shadow:0 20px 60px #0003}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:20px;margin:0;font-weight:650}.close{border:0;background:none;color:#aeb9c6;font-size:23px;padding:0;width:28px;height:28px}label{display:block;margin-bottom:19px}label>span{display:block;margin-bottom:8px;color:#d3d9e1}input,textarea,select{display:block;width:100%;margin:0;border:1px solid #4c5867;border-radius:8px;background:#292f36;color:#e0e4e9;font:inherit;padding:11px 12px;outline:none}input,select{height:44px}input::placeholder,textarea::placeholder{color:#86929f}select{appearance:none;padding-right:40px;background:#333b45}.select{position:relative}.select:after{content:"";position:absolute;right:16px;top:17px;width:7px;height:7px;border-right:1.5px solid #b4bfcc;border-bottom:1.5px solid #b4bfcc;transform:rotate(45deg);pointer-events:none}textarea{height:144px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#a7b7d1;box-shadow:0 0 0 2px #a7b7d126}.hint{font-size:12px;color:#aeb9c6;margin:0;line-height:1.8}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:28px}button{font:inherit;cursor:pointer;white-space:nowrap}.actions button{height:40px;padding:0 16px;border:1px solid #53606e;border-radius:8px;background:transparent;color:#dbe1e8}.actions .cancel{border-color:transparent;color:#aeb9c6;margin-right:auto;padding-left:0}.actions button:not(.cancel){width:132px;padding:0 12px}.actions .primary{background:#a7b7d1;color:#202935;border-color:#a7b7d1;font-weight:550}.play{font-size:12px;margin-right:7px}.note{min-height:20px;margin:14px 4px 0;font-size:12px;color:#aeb9c6}@media(max-width:480px){body{padding:20px 16px}.dialog{padding:22px 20px}.actions{gap:8px}.actions button{padding:0 12px}h1{font-size:18px}}
</style>
<div class="wrap"><p class="caption">设计预览 · 不会创建任务或调用 AI</p><section class="dialog"><header><h1>创建任务卡片</h1><button class="close" aria-label="关闭" onclick="notice('设计预览：关闭弹窗')">×</button></header>
<label><span>功能专题</span><div class="select"><select aria-label="功能专题"><option>其他</option><option>UI</option><option>数据库</option></select></div></label>
<label><span>你想做什么？</span><textarea placeholder="描述你想完成的功能或解决的问题…"></textarea></label>

<footer class="actions"><button class="cancel" onclick="notice('设计预览：取消创建')">取消</button><button onclick="notice('设计预览：卡片已创建，保持未开始状态')">创建</button><button class="primary" onclick="notice('设计预览：创建卡片并开始开发；启动失败时保留卡片并显示原因')"><span class="play">▷</span>创建并开始</button></footer></section><p class="note" id="notice"></p></div><script>function notice(text){document.getElementById('notice').textContent=text}</script></html>
